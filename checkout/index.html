<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publish your site — websites.co.zw</title>
<link rel="icon" type="image/svg+xml" href="https://assets.websites.co.zw/websites-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --surface: #eef0f3;
  --card:    #ffffff;
  --line:    #e3e5ea;
  --ink:     #1a1b22;
  --ink2:    #4a4d59;
  --muted:   #868a96;
  --gold:    #a87d1a;
  --gold-dk: #876312;
  --gold-bg: #f4ecd6;
  --live:    #1d7a4d;
  --live-bg: #e3f2ea;
  --err:     #b23b30;
  --err-bg:  #f7e3e0;
  --r:       14px;
  --r-sm:    9px;
  --shadow:  0 1px 2px rgba(20,22,30,.04), 0 8px 24px rgba(20,22,30,.06);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: var(--surface);
  color: var(--ink);
  font-family: "Hanken Grotesk", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--gold-dk); }
button { font-family: inherit; cursor: pointer; }

/* ── Top bar ── */
.bar {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 15px 22px;
  display: flex; align-items: center; gap: 12px;
}
.logo {
  font-family: "Space Grotesk", sans-serif;
  font-weight: 700; font-size: 18px; letter-spacing: -.01em;
}
.logo .tld { color: var(--gold); }
.bar-sep { color: var(--line); }
.bar-label { font-size: 14px; color: var(--ink2); font-weight: 500; }

/* ── Layout ── */
.wrap {
  max-width: 520px;
  margin: 0 auto;
  padding: 36px 20px 80px;
}

/* ── Card ── */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-head {
  padding: 22px 24px 18px;
  border-bottom: 1px solid var(--line);
}
.card-head h1 {
  font-family: "Space Grotesk", sans-serif;
  font-size: 20px; font-weight: 600; letter-spacing: -.02em;
  margin-bottom: 3px;
}
.card-head .sub { font-size: 13.5px; color: var(--muted); }
.card-body { padding: 22px 24px; }

/* ── Receipt rows ── */
.receipt { display: flex; flex-direction: column; gap: 0; margin-bottom: 20px; }
.receipt-row {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}
.receipt-row:last-child { border-bottom: none; }
.receipt-row.total {
  padding-top: 16px;
  border-top: 2px solid var(--ink);
  border-bottom: none;
  margin-top: 4px;
}
.receipt-key { font-size: 13.5px; color: var(--ink2); }
.receipt-key strong { display: block; font-size: 14.5px; color: var(--ink); font-weight: 600; margin-bottom: 1px; }
.receipt-val {
  font-size: 14px; font-weight: 600; color: var(--ink);
  white-space: nowrap; text-align: right;
}
.receipt-row.total .receipt-key { font-size: 15px; font-weight: 700; color: var(--ink); }
.receipt-row.total .receipt-val { font-size: 20px; font-weight: 700; color: var(--ink); }

/* ── Includes list ── */
.includes {
  background: var(--gold-bg);
  border-radius: var(--r-sm);
  padding: 14px 16px;
  margin-bottom: 20px;
  display: flex; flex-direction: column; gap: 7px;
}
.inc-row {
  display: flex; align-items: center; gap: 9px;
  font-size: 13px; color: var(--ink2);
}
.inc-check {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--gold); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; flex-shrink: 0;
}

/* ── Currency picker ── */
.field-label {
  font-size: 12.5px; font-weight: 600; color: var(--ink2);
  letter-spacing: .02em; margin-bottom: 8px;
}
.phone-input {
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: var(--r-sm);
  padding: 12px 14px;
  font-size: 15px;
  font-family: inherit;
  color: var(--ink);
  background: var(--card);
  margin-bottom: 6px;
  transition: border-color .15s;
}
.phone-input:focus { outline: none; border-color: var(--gold); }
.phone-input::placeholder { color: var(--muted); }
.seg {
  display: flex; border: 1px solid var(--line);
  border-radius: var(--r-sm); overflow: hidden; margin-bottom: 6px;
}
.seg button {
  flex: 1; border: none; background: var(--card);
  padding: 11px 10px; font-size: 14px; font-weight: 600;
  color: var(--ink2); transition: background .12s, color .12s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.seg button small { font-size: 11px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] {
  background: var(--ink); color: #fff;
}
.seg button[aria-pressed="true"] small { color: rgba(255,255,255,.6); }
.seg button:disabled {
  background: #f5f5f7; color: var(--muted); cursor: not-allowed;
}
.seg button:disabled small { color: var(--muted); }
.currency-note { font-size: 12px; color: var(--muted); margin-bottom: 18px; }

/* ── Pay button ── */
.btn-pay {
  width: 100%;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  padding: 15px 20px;
  font-family: "Space Grotesk", sans-serif;
  font-weight: 600; font-size: 16px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: background .15s, transform .12s;
}
.btn-pay:hover:not(:disabled) { background: var(--gold-dk); transform: translateY(-1px); }
.btn-pay:disabled { opacity: .55; cursor: default; transform: none; }
.spinner {
  width: 18px; height: 18px;
  border: 2.5px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: none;
}
.btn-pay.loading .spinner { display: block; }
.btn-pay.loading .pay-label { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.security-note {
  text-align: center; font-size: 12px; color: var(--muted);
  margin-top: 12px;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}

/* ── Error / message box ── */
.msg {
  border-radius: var(--r-sm); padding: 12px 14px;
  font-size: 13.5px; margin-bottom: 16px; display: none;
  line-height: 1.45;
}
.msg.err  { display: block; background: var(--err-bg);  color: var(--err);  border: 1px solid #f3c4c0; }
.msg.info { display: block; background: var(--gold-bg); color: var(--gold-dk); border: 1px solid #e8d5a8; }

/* ── Polling state ── */
.polling-card {
  text-align: center;
  padding: 40px 24px;
}
.polling-spinner {
  width: 44px; height: 44px;
  border: 4px solid var(--line);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .9s linear infinite;
  margin: 0 auto 20px;
}
.polling-card h2 {
  font-family: "Space Grotesk", sans-serif;
  font-size: 18px; font-weight: 600; margin-bottom: 6px;
}
.polling-card p { font-size: 14px; color: var(--muted); margin-bottom: 18px; }
.btn-ghost {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 10px 18px;
  font-size: 13.5px; font-weight: 600; color: var(--ink2);
  transition: border-color .12s, color .12s;
}
.btn-ghost:hover { border-color: var(--ink2); color: var(--ink); }

/* ── Failed state ── */
.failed-card {
  text-align: center;
  padding: 40px 24px 32px;
}
.failed-icon {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--err-bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; margin: 0 auto 18px;
}
.failed-card h2 {
  font-family: "Space Grotesk", sans-serif;
  font-size: 20px; font-weight: 600; margin-bottom: 6px; color: var(--err);
}
.failed-card p { font-size: 14px; color: var(--ink2); margin-bottom: 20px; }

/* ── Skeleton ── */
.skeleton {
  height: 320px; border-radius: var(--r);
  background: linear-gradient(90deg, #f0f1f4, #e8e9ed, #f0f1f4);
  background-size: 200% 100%;
  animation: sh 1.2s infinite;
  border: 1px solid var(--line);
}
@keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

@media (max-width: 480px) {
  .wrap { padding: 20px 14px 60px; }
  .card-head, .card-body { padding: 18px 18px; }
}
</style>
</head>
<body>

<div class="bar">
  <span class="logo">websites<span class="tld">.co.zw</span></span>
  <span class="bar-sep">›</span>
  <span class="bar-label" id="barLabel">Checkout</span>
</div>

<div class="wrap">
  <div id="app"><div class="skeleton"></div></div>
</div>

<script>
(function () {
"use strict";

var APP        = "https://app.websites.co.zw";
var DASH       = APP + "/dashboard/";
var API_DASH   = APP + "/api";  // auth Worker — owns auth, ownership checks, and now delegates payments too
var AUTH_BASE  = APP + "/auth";

var params  = new URLSearchParams(location.search);
var siteId  = params.get("site") || "";
var purpose = params.get("purpose") === "renewal" ? "renewal" : "publish";
var ref     = params.get("ref") || "";   // set by Paynow on return
var planParam = params.get("plan") === "pro" ? "pro" : "starter"; // passed by the dashboard's plan-picker step

var token = localStorage.getItem("wcz_token");
if (!token) {
  location.replace(DASH + "?next=" + encodeURIComponent(location.href));
}

// Bundle pricing — mirrors PLAN_PRICES in customer.html. Domains are never
// priced or sold separately; they're included free inside these totals.
var USD_PRICE = { starter: 30, pro: 50 };
// ZiG pricing comes from the payments Worker's public /pricing endpoint,
// which derives it from env.ZIG_RATE server-side (see payments-worker.js).
// null here means "not fetched yet" or "no rate configured" — either way
// the ZiG option stays disabled until pricingData.zig is a real object.
var PAYMENTS_PUBLIC_BASE = "https://api.websites.co.zw";
var pricingData = { usd: USD_PRICE, zig: null };
var currency = "USD"; // toggled by the Pay-with buttons once ZiG is available
var site      = null;
// Prefilled from /auth/me when available — sign-in is phone/WhatsApp-based
// so email in particular is often missing on first checkout; both stay
// editable regardless of whether they were prefilled.
var knownPhone = "";
var knownEmail = "";

var app = document.getElementById("app");

async function fetchPricing() {
  try {
    var resp = await fetch(PAYMENTS_PUBLIC_BASE + "/pricing");
    if (!resp.ok) return;
    var data = await resp.json();
    if (data && data.ok) pricingData = data;
  } catch (e) { /* non-fatal — USD-only checkout still works */ }
}

async function fetchKnownContact() {
  try {
    var r = await apiFetch(AUTH_BASE + "/me");
    if (r.data && r.data.authenticated && r.data.owner) {
      knownPhone = r.data.owner.phone || "";
      knownEmail = r.data.owner.email || "";
    }
  } catch (e) { /* non-fatal — fields just start blank */ }
}

// ── Boot ──────────────────────────────────────────────────────────────────
(async function init() {
  // Returning from Paynow with a reference → show polling screen
  if (ref) return startPolling(ref);

  if (!siteId) return showError("No site specified. <a href='" + DASH + "'>Go to dashboard →</a>");

  // Load site + live pricing + known contact info in parallel — pricing
  // and contact-prefill are both best-effort and never block checkout.
  var r;
  try {
    var results = await Promise.all([
      apiFetch(API_DASH + "/sites/" + siteId),
      fetchPricing(),
      fetchKnownContact(),
    ]);
    r = results[0];
  } catch (e) {
    return showError("Couldn't load your site. Check your connection and refresh.");
  }
  if (r.status === 401) { location.replace(DASH + "?next=" + encodeURIComponent(location.href)); return; }
  if (!r.data.site)
    return showError("Site not found. <a href='" + DASH + "'>Go to dashboard →</a>");

  site = r.data.site;

  // If already published and purpose is publish (not renewal), redirect to dashboard
  if (site.status === "published" && purpose === "publish") {
    location.replace(DASH);
    return;
  }

  document.getElementById("barLabel").textContent =
    purpose === "renewal" ? "Renew your site" : "Publish your site";

  renderCheckout();
})();

// ── Render checkout form ──────────────────────────────────────────────────
function renderCheckout() {
  var plan       = planParam || (site.plan === "pro" ? "pro" : "starter");
  var planLabel  = plan === "pro" ? "Pro" : "Starter";
  var usdAmount  = USD_PRICE[plan];
  var zigAmount  = pricingData.zig ? pricingData.zig[plan] : null;
  var zigAvailable = zigAmount != null;
  var displayAmount = currency === "ZIG" && zigAvailable ? zigAmount : usdAmount;
  var displayUnit   = currency === "ZIG" && zigAvailable ? "ZiG" : "USD";
  var siteUrl    = site.draft_subdomain
    ? site.draft_subdomain + ".websites.co.zw"
    : site.id + ".websites.co.zw";

  var purposeLabel = purpose === "renewal" ? "Annual renewal" : "Annual subscription";
  var domainLine = plan === "pro"
    ? "Free .com + .co.zw domain included"
    : "Free .co.zw domain included";

  app.innerHTML = "";
  var card = make(
    '<div class="card">' +
      '<div class="card-head">' +
        '<h1>' + esc(purpose === "renewal" ? "Renew your site" : "Publish your site") + '</h1>' +
        '<div class="sub">' + esc(site.site_name || "Your site") + ' &middot; ' + esc(siteUrl) + '</div>' +
      '</div>' +
      '<div class="card-body">' +

        // Receipt — no per-domain pricing, ever. Domain is a plan feature, not a line item.
        '<div class="receipt">' +
          '<div class="receipt-row">' +
            '<div class="receipt-key"><strong>' + esc(planLabel) + ' Plan</strong>' + esc(purposeLabel) + '</div>' +
            '<div class="receipt-val" id="amountDisplay">' + fmtAmount(displayAmount, displayUnit) + '</div>' +
          '</div>' +
          '<div class="receipt-row">' +
            '<div class="receipt-key"><strong>Your domain</strong>' + esc(domainLine) + '</div>' +
            '<div class="receipt-val">Included</div>' +
          '</div>' +
          '<div class="receipt-row total">' +
            '<div class="receipt-key">Total due today</div>' +
            '<div class="receipt-val" id="totalDisplay">' + fmtAmount(displayAmount, displayUnit) + '</div>' +
          '</div>' +
        '</div>' +

        // Includes
        '<div class="includes">' +
          inc("12 months online") +
          inc(domainLine) +
          inc("AI content generation (5 uses)") +
          inc("Unlimited edits & saves") +
          inc("Mobile-optimised site") +
        '</div>' +

        // Currency picker — ZiG enables itself the moment pricingData.zig
        // comes back non-null from /pricing (i.e. env.ZIG_RATE is set).
        '<div class="field-label">Pay with</div>' +
        '<div class="seg" role="group" id="currencyPicker">' +
          '<button type="button" data-cur="USD" aria-pressed="' + (currency === "USD") + '">USD<small>US Dollars</small></button>' +
          '<button type="button" data-cur="ZIG" aria-pressed="' + (currency === "ZIG" && zigAvailable) + '" ' + (zigAvailable ? '' : 'disabled') + '>ZiG<small>' + (zigAvailable ? "ZiG " + zigAmount : "Coming soon") + '</small></button>' +
        '</div>' +
        '<div class="currency-note">' + (zigAvailable ? "ZiG price updates automatically with the daily rate." : "ZiG payments are coming soon — paying in USD for now.") + '</div>' +

        // EcoCash phone number — Paynow pushes an approval prompt straight
        // to this number instead of redirecting the browser to a hosted page.
        '<div class="field-label" style="margin-top:14px">EcoCash phone number</div>' +
        '<input type="tel" id="payerPhone" class="phone-input" placeholder="e.g. 0772 123 456" autocomplete="tel" value="' + esc(knownPhone) + '" />' +

        // Email — Paynow's Express Checkout requires a real email for the
        // receipt; sign-in here doesn't always collect one.
        '<div class="field-label">Email for your receipt</div>' +
        '<input type="email" id="payerEmail" class="phone-input" placeholder="you@example.com" autocomplete="email" value="' + esc(knownEmail) + '" />' +
        '<div class="currency-note">We\'ll send an EcoCash approval prompt to your phone, and your Paynow receipt to this email.</div>' +

        // Error box
        '<div class="msg" id="errMsg"></div>' +

        // Pay button
        '<button class="btn-pay" id="payBtn" onclick="startPayment()">' +
          '<span class="pay-label" id="payLabel">Pay ' + fmtAmount(displayAmount, displayUnit) + ' & ' + (purpose === "renewal" ? "renew" : "publish") + ' →</span>' +
          '<div class="spinner"></div>' +
        '</button>' +
        '<div class="security-note">🔒 Secured by Paynow · Annual billing · Cancel anytime</div>' +
      '</div>' +
    '</div>'
  );
  app.appendChild(card);

  var picker = document.getElementById("currencyPicker");
  if (picker) {
    picker.querySelectorAll("button[data-cur]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.disabled) return;
        currency = btn.getAttribute("data-cur");
        renderCheckout(); // re-render with the new currency's totals — single source of truth, no drift
      });
    });
  }
}

function fmtAmount(amount, unit) {
  return unit === "ZIG" ? "ZiG " + amount : "$" + amount + " " + unit;
}

function inc(text) {
  return '<div class="inc-row"><div class="inc-check">✓</div><span>' + esc(text) + '</span></div>';
}

// ── Initiate payment ─────────────────────────────────────────────────────
// Goes through the auth Worker (Bearer-authed, ownership-checked), which
// delegates the actual Paynow call to the payments Worker. We never talk to
// api.websites.co.zw directly from the browser for the payment itself —
// only /pricing (a public, read-only endpoint) is fetched directly.
//
// This is now the EcoCash phone-push flow (same pattern ZVAKHO's payments
// worker uses): Paynow sends an approval prompt straight to the phone
// number below — there's no hosted payment page to redirect to, so once
// the worker accepts the request we go straight to the "check your phone"
// polling screen instead of navigating away.
window.startPayment = async function () {
  var btn = document.getElementById("payBtn");
  var err = document.getElementById("errMsg");
  if (err) { err.className = "msg"; err.innerHTML = ""; }

  var phoneInput = document.getElementById("payerPhone");
  var phone = phoneInput ? phoneInput.value.trim() : "";
  var phoneDigits = phone.replace(/\D/g, "");
  if (phoneDigits.length < 9) {
    showFormError("Enter the phone number you'll approve the EcoCash prompt on.");
    if (phoneInput) phoneInput.focus();
    return;
  }

  var emailInput = document.getElementById("payerEmail");
  var email = emailInput ? emailInput.value.trim() : "";
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showFormError("Enter a valid email for your Paynow receipt.");
    if (emailInput) emailInput.focus();
    return;
  }

  btn.classList.add("loading");
  btn.disabled = true;

  var plan     = planParam || (site.plan === "pro" ? "pro" : "starter");
  var endpoint = purpose === "renewal" ? "/renew" : "/publish";
  // The server derives the actual amount from plan + currency itself
  // (see payments-worker.js zigAmountFor) — we never send a client-computed
  // amount, for either USD or ZiG.
  var body     = { plan: plan, currency: currency, phone: phone, email: email };

  var r;
  try {
    r = await apiFetch(API_DASH + "/sites/" + siteId + endpoint, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify(body),
    });
  } catch (e) {
    showFormError("Network error. Check your connection and try again.");
    btn.classList.remove("loading"); btn.disabled = false;
    return;
  }

  if (!r.data.poll_url || !r.data.reference) {
    // r.data.detail now carries the actual Paynow-side error (auth-worker
    // no longer wraps it an extra level deep), so this shows the real
    // reason instead of just the literal string "paynow_error".
    var detail = r.data.detail || r.data.error || "Payment could not be initiated.";
    if (typeof detail === "object") detail = detail.error || detail.detail || JSON.stringify(detail);
    showFormError(r.data.error === "currency_unavailable"
      ? (currency === "ZIG" ? "ZiG payments aren't available right now. Please try again shortly or switch to USD." : "USD payments aren't available right now. Please try again shortly.")
      : r.data.error === "zig_rate_not_configured"
      ? "ZiG isn't set up yet — please pay in USD for now."
      : r.data.error === "missing_phone"
      ? "Enter the phone number you'll approve the EcoCash prompt on."
      : r.data.error === "missing_or_invalid_email"
      ? "Enter a valid email for your Paynow receipt."
      : "Couldn't start payment: " + detail + ". Try again.");
    btn.classList.remove("loading"); btn.disabled = false;
    return;
  }

  sessionStorage.setItem("wcz_pay_ref", r.data.reference);

  // No redirect — go straight to the phone-push polling screen.
  startPolling(r.data.reference, {
    heading: "Check your phone",
    sub: "We've sent an EcoCash approval prompt to " + esc(phone) + ".<br>Approve it, then wait a moment here.",
  });
};

// ── Polling screen (phone-push, or returning from Paynow's ?ref=) ──────────
function startPolling(reference, opts) {
  opts = opts || {};
  var heading = opts.heading || "Confirming your payment…";
  var sub     = opts.sub || "This usually takes under 30 seconds.<br>Don't close this tab.";
  document.getElementById("barLabel").textContent = heading;
  app.innerHTML = "";
  var card = make(
    '<div class="card">' +
      '<div class="polling-card">' +
        '<div class="polling-spinner"></div>' +
        '<h2>' + heading + '</h2>' +
        '<p>' + sub + '</p>' +
        '<button class="btn-ghost" id="manualCheck" style="display:none" onclick="pollNow(\'' + esc(reference) + '\')">Check again</button>' +
      '</div>' +
    '</div>'
  );
  app.appendChild(card);

  var attempts = 0;
  var maxAttempts = 20; // phone-push approval can take longer than the old redirect flow
  var interval = setInterval(async function () {
    attempts++;
    var result = await pollStatus(reference);
    if (result === "paid") {
      clearInterval(interval);
      return showSuccess();
    }
    if (result === "cancelled" || result === "failed") {
      clearInterval(interval);
      return showFailed();
    }
    if (attempts >= maxAttempts) {
      clearInterval(interval);
      var btn = document.getElementById("manualCheck");
      if (btn) {
        btn.style.display = "inline-flex";
        var p = btn.previousElementSibling;
        if (p) p.innerHTML = "Taking longer than expected. If you haven't approved the prompt on your phone yet, do that now, then click below.";
      }
    }
  }, 3000);
}

window.pollNow = async function (reference) {
  var btn = document.getElementById("manualCheck");
  if (btn) { btn.disabled = true; btn.textContent = "Checking…"; }
  var result = await pollStatus(reference);
  if (result === "paid")   return showSuccess();
  if (result === "cancelled" || result === "failed") return showFailed();
  if (btn) { btn.disabled = false; btn.textContent = "Check again"; }
};

// Polls through the auth Worker's thin proxy (/api/payments/:ref), which
// itself calls the payments Worker's GET /pay/status. Bearer-authed.
async function pollStatus(reference) {
  try {
    var r = await apiFetch(API_DASH + "/payments/" + encodeURIComponent(reference));
    return (r.data.payment && r.data.payment.status) || "pending";
  } catch (e) {
    return "pending";
  }
}

// ── Success — hand off to the dashboard's post-payment screen ──────────────
// customer.html already has the email-forwarding setup step wired to
// ?paid=1&site=<id> — reuse it instead of duplicating that UI here.
function showSuccess() {
  var qs = "?paid=1&site=" + encodeURIComponent(siteId);
  if (purpose === "renewal") qs += "&renewed=1";
  location.href = DASH + "customer.html" + qs;
}

// ── Failed screen ────────────────────────────────────────────────────────
function showFailed() {
  document.getElementById("barLabel").textContent = "Payment failed";
  app.innerHTML = "";
  app.appendChild(make(
    '<div class="card">' +
      '<div class="failed-card">' +
        '<div class="failed-icon">✕</div>' +
        '<h2>Payment not completed</h2>' +
        '<p>Your payment was cancelled or failed. Your site has been saved as a draft — nothing was lost.</p>' +
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
          '<button class="btn-pay" style="max-width:200px" onclick="location.href=location.pathname+\'?site=' + esc(siteId) + '&purpose=' + esc(purpose) + '&plan=' + esc(planParam) + '\'">Try again</button>' +
          '<button class="btn-ghost" onclick="location.href=\'' + DASH + '\'">Dashboard</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  ));
}

// ── Generic error ───────────────────────────────────────────────────────
function showError(html) {
  app.innerHTML = '<div class="card"><div class="card-body" style="text-align:center;padding:40px 24px">' +
    '<p style="color:var(--err);font-size:15px">' + html + '</p>' +
    '<button class="btn-ghost" style="margin-top:16px" onclick="location.href=\'' + DASH + '\'">Go to dashboard</button>' +
    '</div></div>';
}

function showFormError(msg) {
  var err = document.getElementById("errMsg");
  if (!err) return;
  err.className = "msg err";
  err.textContent = msg;
}

// ── Helpers ─────────────────────────────────────────────────────────────
async function apiFetch(url, opts) {
  var headers = Object.assign({ "Content-Type": "application/json" }, (opts && opts.headers) || {});
  var t = localStorage.getItem("wcz_token");
  if (t) headers["Authorization"] = "Bearer " + t;
  var resp = await fetch(url, Object.assign({}, opts || {}, { headers: headers }));
  var data = {};
  try { data = await resp.json(); } catch (e) {}
  return { status: resp.status, ok: resp.ok, data: data };
}

function make(html) {
  var t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

})();
</script>
</body>
